name: Create New Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: false
        default: 'v2.1.0-cloud'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > androidApp/Nightjar.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Release Files
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Th3GradeLibrary_${{ steps.release_info.outputs.tag }}
          path: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Create Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: كتب وملازم الثالث متوسط 2027 العراق (${{ steps.release_info.outputs.tag }})
          body: |
            تطبيق «كتب وملازم الثالث متوسط 2027 العراق» - الإصدار ${{ steps.release_info.outputs.tag }}

            التحديثات والمميزات:
            - دعم كامل لأحدث معايير Android Jetpack Compose 2026/2027 ومبادئ Navigation 3.
            - إصلاح وتفعيل التوسع والتقلص العائم لقارئ الـ PDF (Shared Element Transitions) بدقة وانسيابية كاملة من الغلاف أو مستطيل الصفحة المحفوظة بدون أي وميض أو قفزات مفاجئة.
            - شاشة المحفوظات: دوران دقيق لسهم المنسدلة بين 0 و 180 درجة فقط، ظهور فوري لخط التقسيم عند التوسع (t=0)، حركات توسع وتقلص سائلة ورطبة، وعزل مستطيلات الصفحات داخل الكارت لمنع القفز لليمين.
            - انسيابية الحذف والإضافة: انكماش القارئ أولاً لمستطيل الصفحة ثم اختفائها بانسيابية، والتوسع التلقائي للصفحات المضافة حديثاً.
            - شاشة المكتبة: تنقل فوري وسلس بين وضعي القائمة والشبكة مع ثبات الأغلفة ومنع التمرير التلقائي أو قفزات الكتب عند إغلاق القارئ.
            - فتح القارئ مباشرة وبدون أي وميض عبر الاختصارات الخارجية وروابط التطبيق.
            - تنظيف فوري وشامل لملفات الـ PDF المؤقتة عبر خدمة Cleanup المستقلة بمجرد إغلاق التطبيق من قائمة التطبيقات الحديثة.
          files: |
            androidApp/build/outputs/apk/release/Th3GradeLibrary_${{ steps.release_info.outputs.tag }}.apk
            androidApp/build/outputs/apk/release/كتب_وملازم_الثالث_متوسط_${{ steps.release_info.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}